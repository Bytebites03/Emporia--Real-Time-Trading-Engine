<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Engine - Professional Trading Platform</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>⚡ Advanced Trading Engine</h1>
            <div class="connection-status" id="connectionStatus">
                <span class="status-dot"></span> Connecting...
            </div>
            <div class="user-info" style="display: flex; align-items: center; gap: 15px; margin-left: auto;">
                <span style="color: #4caf50;">👤 <span id="usernameDisplay"></span></span>
                <button onclick="logout()" style="padding: 5px 15px; background: #ff4444; border: none; border-radius: 5px; color: white; cursor: pointer; font-size: 14px;">
                    Logout
                </button>
            </div>
        </header>

        <!-- Main Grid -->
        <div class="grid">
            <!-- Left Column: Trading Form -->
            <div class="card">
                <h2>Place Order</h2>
                <form id="orderForm">
                    <div class="form-group">
                        <label>Side</label>
                        <div class="button-group">
                            <button type="button" id="buyBtn" class="btn-buy active">BUY</button>
                            <button type="button" id="sellBtn" class="btn-sell">SELL</button>
                        </div>
                        <input type="hidden" id="side" value="buy">
                    </div>

                    <div class="form-group">
                        <label>Order Type</label>
                        <select id="orderType">
                            <option value="market">Market Order</option>
                            <option value="limit">Limit Order</option>
                        </select>
                    </div>

                    <div class="form-group" id="priceGroup">
                        <label>Price (USD)</label>
                        <input type="number" id="price" step="10" placeholder="Enter price">
                    </div>

                    <div class="form-group">
                        <label>Quantity (BTC)</label>
                        <input type="number" id="quantity" step="0.001" placeholder="Enter quantity">
                    </div>

                    <div class="form-group">
                        <label>Total Value</label>
                        <input type="text" id="totalValue" readonly placeholder="0.00 USD">
                    </div>

                    <button type="submit" class="btn-submit">Place Order</button>
                </form>
            </div>

            <!-- Portfolio Card -->
            <div class="card">
                <h2>Portfolio</h2>
                <div class="portfolio-stats">
                    <div class="stat">
                        <span class="stat-label">Cash Balance</span>
                        <span class="stat-value" id="cashBalance">$0.00</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">BTC Balance</span>
                        <span class="stat-value" id="btcBalance">0.0000 BTC</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Total Value</span>
                        <span class="stat-value" id="totalValueDisplay">$0.00</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">Current Price</span>
                        <span class="stat-value" id="currentPrice">$0.00</span>
                    </div>
                </div>
            </div>

            <!-- Order Book Card -->
            <div class="card orderbook-card">
                <h2>Order Book</h2>
                <div class="orderbook-container">
                    <div class="orderbook-header">
                        <span>Price (USD)</span>
                        <span>Size (BTC)</span>
                        <span>Total (USD)</span>
                    </div>
                    <div class="asks" id="asks"></div>
                    <div class="spread" id="spread"></div>
                    <div class="bids" id="bids"></div>
                </div>
            </div>

            <!-- Recent Trades Card -->
            <div class="card trades-card">
                <h2>Recent Trades</h2>
                <div class="trades-header">
                    <span>Time</span>
                    <span>Price</span>
                    <span>Size</span>
                </div>
                <div id="trades" class="trades-list"></div>
            </div>

            <!-- Open Orders Card -->
            <div class="card">
                <h2>My Open Orders</h2>
                <div id="openOrders" class="orders-list">
                    <div class="empty-state">No open orders</div>
                </div>
            </div>

            <!-- Price Chart Card -->
            <div class="card chart-card">
                <h2>Price Chart</h2>
                <canvas id="priceChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Check if user is authenticated
        const token = localStorage.getItem('access_token');
        const username = localStorage.getItem('username');
        
        if (!token) {
            window.location.href = 'login.html';
        }
        
        // Display username
        document.getElementById('usernameDisplay').textContent = username || 'User';
        
        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
    <script src="app.js"></script>
    <script src="chatbot-widget.js"></script>
</body>
</html>
